<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Paradise Photo Booth</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* BEACH BACKGROUND */

.beach {
    min-height: 100vh;
    position: relative;
    overflow: hidden;

    background: linear-gradient(
        to bottom,
        #8ed8f0 0%,
        #c7eff8 52%,
        #5fc7df 52%,
        #5fc7df 68%,
        #f6dca8 68%,
        #f6dca8 100%
    );
}

/* SUN */

.sun {
    position: absolute;
    top: 45px;
    right: 8%;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #ffe49a;

    box-shadow: 0 0 35px #ffe49a;
}

/* CLOUDS */

.cloud {
    position: absolute;

    width: 130px;
    height: 42px;

    background: white;

    border-radius: 50px;

    opacity: .9;

    z-index: 2;
}

.cloud::before {
    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    left: 20px;
    bottom: 12px;

    background: white;

    border-radius: 50%;
}

.cloud::after {
    content: "";

    position: absolute;

    width: 60px;
    height: 60px;

    right: 18px;
    bottom: 10px;

    background: white;

    border-radius: 50%;
}

.cloud1 {
    top: 100px;
    left: -200px;

    animation: clouds 35s linear infinite;
}

.cloud2 {
    top: 210px;
    left: -300px;

    transform: scale(.7);

    animation: clouds 45s linear infinite;
}

@keyframes clouds {

    from {
        left: -250px;
    }

    to {
        left: 110%;
    }

}

/* TITLE */

.title {
    position: relative;
    z-index: 10;

    text-align: center;

    padding-top: 30px;

    color: white;
}

.title h1 {
    font-size: 43px;

    text-shadow:
        0 4px #f45b91,
        0 7px 15px rgba(0,0,0,.15);
}

.title p {
    margin-top: 8px;
    font-size: 17px;
}

/* MAIN */

.main {
    position: relative;
    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: flex-start;

    gap: 35px;

    margin-top: 30px;

    padding-bottom: 150px;
}

/* CAMERA BOOTH */

.booth {
    width: 460px;

    padding: 23px;

    background: #ff9fc4;

    border: 7px solid white;

    border-radius: 30px;

    box-shadow:
        0 18px 40px rgba(90,61,74,.25);
}

.booth-title {
    background: #f45b91;

    color: white;

    text-align: center;

    padding: 14px;

    border-radius: 15px;

    margin-bottom: 18px;

    font-weight: bold;

    letter-spacing: 2px;
}

/* CAMERA */

.camera-container {

    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

    background: #3f3439;

    border: 5px solid white;

    border-radius: 18px;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;
}

#video {

    display: none;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

.camera-message {

    color: white;

    text-align: center;

    padding: 20px;
}

.camera-message .icon {
    font-size: 60px;
    margin-bottom: 10px;
}

/* CAMERA ERROR */

.camera-error {

    display: none;

    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 15px;

    padding: 10px;

    background: rgba(255,255,255,.95);

    color: #d94f7f;

    border-radius: 10px;

    text-align: center;

    font-size: 13px;
}

/* COUNTDOWN */

#countdown {

    display: none;

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    color: white;

    font-size: 100px;

    font-weight: bold;

    text-shadow: 0 5px 20px rgba(0,0,0,.5);
}

/* START BUTTON */

#startButton {

    display: block;

    margin: 20px auto 0;

    padding: 15px 30px;

    border: none;

    border-radius: 50px;

    background: white;

    color: #f45b91;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;

    box-shadow: 0 6px 15px rgba(0,0,0,.12);
}

#startButton:hover {
    transform: scale(1.04);
}

/* RIGHT SIDE */

.controls {

    width: 270px;

    display: flex;

    flex-direction: column;

    align-items: center;
}

/* COLOR SELECTOR */

.color-panel {

    width: 270px;

    background: white;

    padding: 18px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 12px 25px rgba(90,61,74,.15);
}

.color-panel h3 {

    color: #f45b91;

    margin-bottom: 15px;
}

.colors {

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;
}

.color {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    border: 3px solid white;

    outline: 2px solid transparent;

    cursor: pointer;

    transition: .2s;
}

.color:hover {
    transform: scale(1.12);
}

.color.selected {
    outline: 3px solid #5a3d4a;
    transform: scale(1.08);
}

/* COLORS */

.pink {
    background: #ff8fba;
}

.blue {
    background: #65c9df;
}

.purple {
    background: #b99be8;
}

.peach {
    background: #ffb38a;
}

.yellow {
    background: #f7d96b;
}

.white {
    background: white;
}

/* PHOTO STRIP */

.photo-strip {

    display: none;

    width: 230px;

    margin-top: 20px;

    padding: 16px;

    background: #ff8fba;

    border-radius: 12px;

    box-shadow:
        0 15px 30px rgba(0,0,0,.25);

    transition: background .3s;
}

.strip-title {

    color: white;

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 10px;
}

.photo {

    width: 100%;

    aspect-ratio: 4 / 3;

    object-fit: cover;

    display: block;

    border: 4px solid white;

    margin-bottom: 8px;
}

.strip-footer {

    color: white;

    text-align: center;

    font-size: 12px;

    margin-top: 10px;
}

/* ACTION BUTTONS */

.action {

    display: none;

    width: 230px;

    padding: 12px;

    margin-top: 10px;

    border: none;

    border-radius: 50px;

    font-weight: bold;

    cursor: pointer;
}

#retakeButton {

    background: white;

    color: #f45b91;
}

#saveButton {

    background: #5a3d4a;

    color: white;
}

/* UMBRELLA */

.umbrella {

    position: absolute;

    z-index: 7;

    bottom: 55px;
    left: 6%;
}

.umbrella-top {

    width: 190px;
    height: 95px;

    background:
        repeating-conic-gradient(
            #ff78aa 0deg 30deg,
            #ffd1e0 30deg 60deg
        );

    border: 5px solid white;

    border-radius:
        190px 190px 0 0;
}

.umbrella-pole {

    width: 7px;
    height: 100px;

    background: #a86f55;

    margin: -3px auto 0;
}

/* BEACH BALL */

.ball {

    position: absolute;

    z-index: 8;

    right: 8%;
    bottom: 45px;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background:
        conic-gradient(
            #ff78aa 0 60deg,
            white 60deg 120deg,
            #69cbe5 120deg 180deg,
            white 180deg 240deg,
            #ff78aa 240deg 300deg,
            white 300deg 360deg
        );

    border: 4px solid white;
}

/* MOBILE */

@media(max-width: 800px) {

    .main {
        flex-direction: column;
        align-items: center;
    }

    .booth {
        width: 92%;
        max-width: 460px;
    }

    .title h1 {
        font-size: 32px;
    }

    .umbrella {
        transform: scale(.6);
        transform-origin: bottom left;
        left: 0;
    }

}

</style>
</head>


<body>

<div class="beach">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>


    <div class="title">

        <h1>🌴 Pink Paradise</h1>

        <p>
            Capture your perfect beach day 📸
        </p>

    </div>


    <div class="main">


        <!-- CAMERA -->

        <div class="booth">

            <div class="booth-title">
                📸 BEACH PHOTO BOOTH
            </div>


            <div class="camera-container">

                <video
                    id="video"
                    autoplay
                    playsinline>
                </video>


                <div
                    class="camera-message"
                    id="cameraMessage">

                    <div class="icon">
                        📷
                    </div>

                    <p>
                        Click the button below<br>
                        to start your camera
                    </p>

                </div>


                <div id="countdown"></div>


                <div
                    class="camera-error"
                    id="cameraError">
                </div>

            </div>


            <button id="startButton">
                START PHOTO BOOTH 📸
            </button>

        </div>


        <!-- CONTROLS -->

        <div class="controls">


            <!-- COLORS -->

            <div class="color-panel">

                <h3>
                    🎨 Choose Your Frame
                </h3>


                <div class="colors">


                    <button
                        class="color pink selected"
                        data-color="#ff8fba"
                        aria-label="Pink">
                    </button>


                    <button
                        class="color blue"
                        data-color="#65c9df"
                        aria-label="Blue">
                    </button>


                    <button
                        class="color purple"
                        data-color="#b99be8"
                        aria-label="Purple">
                    </button>


                    <button
                        class="color peach"
                        data-color="#ffb38a"
                        aria-label="Peach">
                    </button>


                    <button
                        class="color yellow"
                        data-color="#f7d96b"
                        aria-label="Yellow">
                    </button>


                    <button
                        class="color white"
                        data-color="#ffffff"
                        aria-label="White">
                    </button>


                </div>

            </div>


            <!-- PHOTO STRIP -->

            <div
                class="photo-strip"
                id="photoStrip">

                <div class="strip-title">
                    🌴 PINK PARADISE 🌴
                </div>


                <img
                    class="photo"
                    id="photo1"
                    alt="Photo 1">


                <img
                    class="photo"
                    id="photo2"
                    alt="Photo 2">


                <img
                    class="photo"
                    id="photo3"
                    alt="Photo 3">


                <div class="strip-footer">
                    ☀️ BEACH DAY ☀️
                </div>

            </div>


            <button
                class="action"
                id="retakeButton">

                ↻ RETAKE

            </button>


            <button
                class="action"
                id="saveButton">

                ↓ SAVE PHOTO STRIP

            </button>


        </div>

    </div>


    <div class="umbrella">

        <div class="umbrella-top"></div>

        <div class="umbrella-pole"></div>

    </div>


    <div class="ball"></div>

</div>


<script>

/* ==========================================
   GET ELEMENTS
========================================== */

const video =
    document.getElementById("video");

const cameraMessage =
    document.getElementById("cameraMessage");

const cameraError =
    document.getElementById("cameraError");

const startButton =
    document.getElementById("startButton");

const countdown =
    document.getElementById("countdown");

const photoStrip =
    document.getElementById("photoStrip");

const photo1 =
    document.getElementById("photo1");

const photo2 =
    document.getElementById("photo2");

const photo3 =
    document.getElementById("photo3");

const retakeButton =
    document.getElementById("retakeButton");

const saveButton =
    document.getElementById("saveButton");

const colors =
    document.querySelectorAll(".color");


/* ==========================================
   VARIABLES
========================================== */

let stream = null;

let selectedColor = "#ff8fba";

let photos = [];


/* ==========================================
   COLOR CHANGER
========================================== */

colors.forEach(button => {

    button.addEventListener("click", function() {

        selectedColor =
            this.getAttribute("data-color");


        /* CHANGE PHOTO STRIP */

        photoStrip.style.background =
            selectedColor;


        /* CHANGE SELECTED CIRCLE */

        colors.forEach(item => {

            item.classList.remove("selected");

        });


        this.classList.add("selected");

    });

});


/* ==========================================
   CAMERA
========================================== */

async function openCamera() {

    cameraError.style.display = "none";


    /* CHECK CAMERA SUPPORT */

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        cameraError.textContent =
            "Your browser does not support camera access.";

        cameraError.style.display =
            "block";

        return false;
    }


    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        video.srcObject =
            stream;


        video.style.display =
            "block";


        cameraMessage.style.display =
            "none";


        return true;

    }

    catch(error) {

        console.error(error);


        cameraError.textContent =
            "Camera access was blocked. Click the camera icon 🔒 in your browser's address bar and allow camera access, then refresh the page.";


        cameraError.style.display =
            "block";


        return false;

    }

}


/* ==========================================
   COUNTDOWN
========================================== */

function countdownTimer() {

    return new Promise(resolve => {

        let number = 3;


        countdown.style.display =
            "block";


        countdown.textContent =
            number;


        const timer =
            setInterval(() => {

                number--;


                if(number > 0) {

                    countdown.textContent =
                        number;

                }

                else {

                    countdown.textContent =
                        "📸";


                    setTimeout(() => {

                        countdown.style.display =
                            "none";


                        clearInterval(timer);


                        resolve();

                    }, 500);

                }

            }, 1000);

    });

}


/* ==========================================
   TAKE PHOTO
========================================== */

function takePhoto() {

    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext("2d");


    /* MIRROR PHOTO */

    context.translate(
        canvas.width,
        0
    );

    context.scale(
        -1,
        1
    );


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas.toDataURL(
        "image/png"
    );

}


/* ==========================================
   TAKE 3 PHOTOS
========================================== */

async function takePhotos() {

    startButton.disabled =
        true;

    startButton.textContent =
        "GET READY... 📸";


    retakeButton.style.display =
        "none";

    saveButton.style.display =
        "none";

    photoStrip.style.display =
        "none";


    photos = [];


    /* PHOTO ONE */

    await countdownTimer();

    photos.push(
        takePhoto()
    );


    await wait(700);


    /* PHOTO TWO */

    await countdownTimer();

    photos.push(
        takePhoto()
    );


    await wait(700);


    /* PHOTO THREE */

    await countdownTimer();

    photos.push(
        takePhoto()
    );


    /* DISPLAY */

    photo1.src =
        photos[0];

    photo2.src =
        photos[1];

    photo3.src =
        photos[2];


    photoStrip.style.background =
        selectedColor;


    photoStrip.style.display =
        "block";


    retakeButton.style.display =
        "block";

    saveButton.style.display =
        "block";


    startButton.disabled =
        false;

    startButton.textContent =
        "TAKE 3 MORE PHOTOS 📸";

}


/* ==========================================
   WAIT
========================================== */

function wait(milliseconds) {

    return new Promise(resolve => {

        setTimeout(
            resolve,
            milliseconds
        );

    });

}


/* ==========================================
   START BUTTON
========================================== */

startButton.addEventListener(
    "click",
    async function() {

        if(!stream) {

            const cameraStarted =
                await openCamera();


            if(!cameraStarted) {

                return;

            }


            await wait(1000);

        }


        takePhotos();

    }
);


/* ==========================================
   RETAKE
========================================== */

retakeButton.addEventListener(
    "click",
    function() {

        takePhotos();

    }
);


/* ==========================================
   SAVE PHOTO STRIP
========================================== */

saveButton.addEventListener(
    "click",
    function() {

        if(photos.length !== 3) {
            return;
        }


        const canvas =
            document.createElement("canvas");


        canvas.width = 600;
        canvas.height = 980;


        const ctx =
            canvas.getContext("2d");


        /* FRAME */

        ctx.fillStyle =
            selectedColor;

        ctx.fillRect(
            0,
            0,
            600,
            980
        );


        /* TITLE */

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 30px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "🌴 PINK PARADISE 🌴",
            300,
            40
        );


        /* PHOTOS */

        const imageWidth = 540;
        const imageHeight = 270;

        const x = 30;


        const images = [
            photo1,
            photo2,
            photo3
        ];


        images.forEach(
            (image,index) => {

                const y =
                    60 +
                    index *
                    290;


                ctx.drawImage(
                    image,
                    x,
                    y,
                    imageWidth,
                    imageHeight
                );

            }
        );


        /* FOOTER */

        ctx.font =
            "bold 22px Arial";

        ctx.fillText(
            "☀️ BEACH DAY ☀️",
            300,
            965
        );


        /* SAVE */

        const link =
            document.createElement("a");


        link.download =
            "pink-paradise-photo-strip.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();

    }
);

</script>

</body>
</html>
